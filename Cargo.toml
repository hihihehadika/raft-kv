[package]
name = "raft-kv"
version = "0.1.0"
edition = "2021"
description = "A mini distributed key-value store with Raft consensus, built from scratch."

[[bin]]
name = "raft-kv-node"
path = "src/main.rs"

[[bin]]
name = "raft-kv-cli"
path = "src/bin/cli.rs"

[dependencies]
# Stage 2: serialization for WAL entries
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stage 3: async networking between nodes
tokio = { version = "1", features = ["full"] }

# Stage 4: CLI argument parsing
clap = { version = "4", features = ["derive"] }
rand = "0.8"
