[package]
name = "raft-kv"
version = "0.1.0"
edition = "2021"
description = "A mini distributed key-value store with Raft consensus, built from scratch."

[[bin]]
name = "raft-kv-node"
path = "src/main.rs"

[[bin]]
name = "raft-kv-cli"
path = "src/bin/cli.rs"

[dependencies]
# Stage 1: just std. Add these as you progress through the stages:
#
# Stage 1 (single-node store):
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
#
# Stage 3 (networking between nodes):
# tokio = { version = "1", features = ["full"] }
# tonic = "0.11"      # if you go gRPC route for RPCs
# prost = "0.12"
# bincode = "1"       # binary serialization, often used in Raft impls
#
# Stage 4 (CLI client):
# clap = { version = "4", features = ["derive"] }
